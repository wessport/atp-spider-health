version: 2

models:
  - name: stg_runs
    description: One row per AllThePlaces run, renamed and typed.
    columns:
      - name: run_id
        description: Run identifier, the run's UTC start time (YYYY-MM-DD-HH-MM-SS).
        data_tests:
          - unique
          - not_null
      - name: run_started_at
        data_tests:
          - not_null
      - name: reported_spider_count
        description: Spider count reported by history.json (null for older runs).
        data_tests:
          - non_negative
      - name: reported_feature_count
        description: total_lines reported by history.json (null for older runs).
        data_tests:
          - non_negative

  - name: stg_spider_run_stats
    description: One row per spider per sampled run.
    columns:
      - name: spider_run_id
        description: Stable key, run_id || '/' || spider. Unique means (spider, run_id) is unique.
        data_tests:
          - unique
          - not_null
      - name: spider
        data_tests:
          - not_null
      - name: feature_count
        data_tests:
          - not_null
          - non_negative
      - name: error_count
        data_tests:
          - not_null
          - non_negative
